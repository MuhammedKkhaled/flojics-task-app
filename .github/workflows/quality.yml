name: Quality

on:
    push:
    pull_request:

jobs:
    backend:
        name: Backend quality
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: flojics_help_desk_test
                    MYSQL_USER: flojics
                    MYSQL_PASSWORD: secret
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h localhost -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
        env:
            APP_ENV: testing
            APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
            DB_CONNECTION: mysql
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: flojics_help_desk_test
            DB_USERNAME: flojics
            DB_PASSWORD: secret
            CACHE_STORE: array
            MAIL_MAILER: array
            QUEUE_CONNECTION: sync

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Check PHP formatting
              run: vendor/bin/pint --test

            - name: Run Larastan
              run: composer analyse

            - name: Run Pest
              run: php artisan test

    frontend:
        name: Frontend quality
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Lint Vue source
              run: npm run lint

            - name: Check frontend formatting
              run: npm run format:check

            - name: Run Vitest
              run: npm run test

            - name: Build frontend
              run: npm run build
